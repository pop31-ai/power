<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Bubbles</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
canvas { display: block; border-radius: 8px; box-shadow: 0 0 60px rgba(100, 50, 255, 0.3); }
#ui { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 30px; color: #fff; font-size: 16px; text-shadow: 0 0 10px rgba(255,255,255,0.5); pointer-events: none; z-index: 2; }
#ui span { opacity: 0.9; white-space: nowrap; }
#overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #fff; pointer-events: none; transition: opacity 0.4s; z-index: 3; }
#overlay h1 { font-size: 44px; margin-bottom: 10px; text-shadow: 0 0 30px rgba(150, 80, 255, 0.8); }
#overlay p { font-size: 16px; opacity: 0.7; line-height: 1.6; }
#overlay .hi { color: #ffcc00; font-size: 20px; margin-top: 8px; }
#levelUp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #0f0; font-size: 36px; font-weight: bold; text-shadow: 0 0 20px #0f0; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 3; }
#powerText { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #ff0; font-size: 14px; pointer-events: none; opacity: 0; transition: opacity 0.3s; z-index: 2; text-shadow: 0 0 8px #ff0; }
</style>
</head>
<body>
<div id="ui">
  <span>SCORE: <b id="score">0</b></span>
  <span>COMBO: <b id="combo">x1</b></span>
  <span>LVL: <b id="level">1</b></span>
  <span>LIVES: <b id="lives">♥♥♥</b></span>
  <span id="hiWrap">HI: <b id="hi">0</b></span>
</div>
<canvas id="c"></canvas>
<div id="overlay"><h1>COSMIC BUBBLES</h1><p>Лопайте пузыри, собирайте power-ups<br>Не пропускайте!</p></div>
<div id="levelUp"></div>
<div id="powerText"></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width = Math.min(900, window.innerWidth - 40);
const H = canvas.height = Math.min(620, window.innerHeight - 40);

const ui = {
  score: document.getElementById('score'),
  combo: document.getElementById('combo'),
  level: document.getElementById('level'),
  lives: document.getElementById('lives'),
  hi: document.getElementById('hi'),
  overlay: document.getElementById('overlay'),
  levelUp: document.getElementById('levelUp'),
  powerText: document.getElementById('powerText'),
};

let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, dur, type, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

function sfxPop() { playTone(600 + Math.random() * 400, 0.12, 'sine', 0.12); }
function sfxCombo() { playTone(900, 0.08, 'square', 0.08); setTimeout(() => playTone(1200, 0.12, 'square', 0.08), 60); }
function sfxPower() { playTone(400, 0.15, 'triangle', 0.1); setTimeout(() => playTone(600, 0.15, 'triangle', 0.1), 80); setTimeout(() => playTone(900, 0.2, 'triangle', 0.1), 160); }
function sfxLevelUp() { [0,80,160,240].forEach((d,i) => setTimeout(() => playTone(500 + i * 200, 0.2, 'square', 0.1), d)); }
function sfxDeath() { playTone(200, 0.3, 'sawtooth', 0.15); setTimeout(() => playTone(120, 0.4, 'sawtooth', 0.12), 150); }
function sfxBlackHole() { playTone(80, 0.5, 'sawtooth', 0.2); }

let bubbles = [];
let particles = [];
let floatingTexts = [];
let powerUps = [];
let stars = [];
let shake = { x: 0, y: 0, intensity: 0 };

let score = 0;
let combo = 1;
let comboTimer = 0;
let lives = 3;
let level = 1;
let frame = 0;
let gameOver = false;
let started = false;
let hiScore = 0;
let spawnTimer = 0;
let powerTimer = 0;
let activePower = null;
let activePowerTime = 0;

try { hiScore = parseInt(localStorage.getItem('cosmicBubblesHi')) || 0; } catch(e) {}
ui.hi.textContent = hiScore;

const COLORS = [
  ['#ff6b9d', '#c44569'], ['#4ecdc4', '#2c9e8f'], ['#ffeaa7', '#dfe6e9'],
  ['#a29bfe', '#6c5ce7'], ['#fd79a8', '#e84393'], ['#55efc4', '#00b894'],
  ['#fdcb6e', '#f39c12'], ['#74b9ff', '#0984e3'],
];

const POWER_TYPES = [
  { id: 'freeze', label: '❄ FREEZE', color: '#88ddff', dur: 300 },
  { id: 'magnet', label: '🧲 MAGNET', color: '#ff88ff', dur: 250 },
  { id: 'bomb', label: '💣 BOMB', color: '#ff6644', dur: 0 },
  { id: 'life', label: '♥ +LIFE', color: '#ff4466', dur: 0 },
  { id: 'x2', label: '✨ x2 SCORE', color: '#ffdd44', dur: 300 },
];

function initStars() {
  stars = [];
  for (let i = 0; i < 150; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + 0.3, a: Math.random() * Math.PI * 2, speed: 0.005 + Math.random() * 0.015 });
  }
}
initStars();

class Bubble {
  constructor(isBlackHole) {
    this.isBlackHole = !!isBlackHole;
    this.r = this.isBlackHole ? 22 + Math.random() * 10 : 18 + Math.random() * 28;
    this.x = this.r + Math.random() * (W - this.r * 2);
    this.y = H + this.r + Math.random() * 80;
    const speedMult = 1 + (level - 1) * 0.12;
    this.vy = -(1 + Math.random() * 1.5 + (score / 500)) * speedMult;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.wobbleAmp = Math.random() * 2;
    this.wobbleSpeed = 0.02 + Math.random() * 0.03;
    this.phase = Math.random() * Math.PI * 2;
    this.color = this.isBlackHole ? ['#222', '#111'] : COLORS[Math.floor(Math.random() * COLORS.length)];
    this.glow = this.isBlackHole ? 20 : Math.random() * 15 + 5;
    this.alive = true;
    this.pulse = 0;
    this.frozen = false;
    this.slowTimer = 0;
  }
  update() {
    if (this.frozen) {
      this.slowTimer--;
      if (this.slowTimer <= 0) this.frozen = false;
    }
    const spd = this.frozen ? 0.3 : 1;
    this.pulse += 0.05;
    this.phase += this.wobbleSpeed;
    this.x += (this.vx + Math.sin(this.phase) * this.wobbleAmp) * spd;
    this.y += this.vy * spd;
    if (this.y < -this.r * 2) {
      this.alive = false;
      if (!gameOver && !this.isBlackHole) {
        combo = 1;
        updateUI();
      }
    }
  }
  draw() {
    const wobble = Math.sin(this.pulse) * (this.frozen ? 1 : 3);
    const r = this.r + wobble;
    if (this.isBlackHole) {
      this.drawBlackHole(r);
      return;
    }
    const grad = ctx.createRadialGradient(this.x - r * 0.3, this.y - r * 0.3, r * 0.1, this.x, this.y, r);
    grad.addColorStop(0, 'rgba(255,255,255,0.6)');
    grad.addColorStop(0.4, this.color[0]);
    grad.addColorStop(1, this.color[1]);
    ctx.save();
    ctx.shadowColor = this.frozen ? '#88ddff' : this.color[0];
    ctx.shadowBlur = this.frozen ? 20 : this.glow;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(this.x - r * 0.25, this.y - r * 0.25, r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();
    if (this.frozen) {
      ctx.strokeStyle = 'rgba(136,221,255,0.6)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    ctx.restore();
  }
  drawBlackHole(r) {
    ctx.save();
    const t = frame * 0.03;
    for (let i = 3; i >= 0; i--) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, r + i * 8, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(120,0,255,${0.15 - i * 0.03})`;
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
    grad.addColorStop(0, 'rgba(0,0,0,1)');
    grad.addColorStop(0.5, 'rgba(20,0,60,0.9)');
    grad.addColorStop(1, 'rgba(80,0,200,0.3)');
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();
    for (let i = 0; i < 4; i++) {
      const a = t + i * Math.PI / 2;
      const sx = this.x + Math.cos(a) * r * 1.5;
      const sy = this.y + Math.sin(a) * r * 1.5;
      ctx.beginPath();
      ctx.arc(sx, sy, 2, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(150,80,255,0.6)';
      ctx.fill();
    }
    ctx.restore();
  }
  contains(px, py) {
    const dx = px - this.x, dy = py - this.y;
    return dx * dx + dy * dy < this.r * this.r * 1.3;
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.r = 2 + Math.random() * 4;
    this.color = color;
    this.life = 1;
    this.decay = 0.02 + Math.random() * 0.03;
    this.alive = true;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.05; this.vx *= 0.98;
    this.life -= this.decay;
    if (this.life <= 0) this.alive = false;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * this.life, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.restore();
  }
}

class FloatingText {
  constructor(x, y, text, color, size) {
    this.x = x; this.y = y;
    this.text = text;
    this.color = color || '#fff';
    this.size = size || 18;
    this.life = 1;
    this.vy = -2;
    this.alive = true;
  }
  update() {
    this.y += this.vy;
    this.vy *= 0.96;
    this.life -= 0.018;
    if (this.life <= 0) this.alive = false;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.font = `bold ${this.size}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = this.color;
    ctx.fillText(this.text, this.x, this.y);
    ctx.restore();
  }
}

class PowerUp {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.r = 14;
    this.vy = -0.5 - Math.random() * 0.5;
    this.type = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
    this.alive = true;
    this.pulse = 0;
    this.life = 1;
  }
  update() {
    this.y += this.vy;
    this.pulse += 0.08;
    if (this.y < -30 || (this.type.dur === 0 && this.life < 1)) this.alive = false;
  }
  draw() {
    const scale = 1 + Math.sin(this.pulse) * 0.15;
    ctx.save();
    ctx.globalAlpha = Math.min(1, this.life);
    ctx.shadowColor = this.type.color;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r * scale, 0, Math.PI * 2);
    ctx.fillStyle = this.type.color + '33';
    ctx.fill();
    ctx.strokeStyle = this.type.color;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = this.type.color;
    const icons = { freeze: '❄', magnet: '🧲', bomb: '💥', life: '♥', x2: '×2' };
    ctx.fillText(icons[this.type.id], this.x, this.y);
    ctx.restore();
  }
  contains(px, py) {
    const dx = px - this.x, dy = py - this.y;
    return dx * dx + dy * dy < (this.r + 10) * (this.r + 10);
  }
}

function spawnBubble() {
  const maxOnScreen = Math.min(22, 12 + Math.floor(level * 1.5));
  if (bubbles.length < maxOnScreen) {
    const blackHoleChance = Math.min(0.12, 0.02 + level * 0.015);
    bubbles.push(new Bubble(Math.random() < blackHoleChance));
  }
}

function popBubble(b) {
  const pts = 10 * combo * (activePower === 'x2' ? 2 : 1);
  for (let i = 0; i < 12; i++) {
    particles.push(new Particle(b.x, b.y, b.color[Math.floor(Math.random() * 2)]));
  }
  floatingTexts.push(new FloatingText(b.x, b.y, '+' + pts, b.color[0], 16 + combo * 2));
  score += pts;
  comboTimer = 70;
  combo++;
  if (combo > 1 && combo % 5 === 0) sfxCombo();
  else sfxPop();
  addShake(3 + combo * 0.5);
  updateUI();

  if (Math.random() < 0.08 + level * 0.01) {
    powerUps.push(new PowerUp(b.x, b.y));
  }
}

function hitBlackHole(b) {
  sfxBlackHole();
  floatingTexts.push(new FloatingText(b.x, b.y, 'BLACK HOLE!', '#a855f7', 22));
  addShake(10);
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(b.x, b.y, '#8844ff'));
  }
  combo = 1;
  loseLife();
  updateUI();
}

function activatePower(pu) {
  sfxPower();
  if (pu.type.id === 'life') {
    lives = Math.min(5, lives + 1);
    showPowerText('+1 LIFE');
  } else if (pu.type.id === 'bomb') {
    bubbles.forEach(b => {
      if (!b.isBlackHole) {
        score += 5;
        for (let i = 0; i < 6; i++) particles.push(new Particle(b.x, b.y, b.color[i % 2]));
      }
    });
    bubbles = [];
    addShake(15);
    showPowerText('BOMB!');
  } else {
    activePower = pu.type.id;
    activePowerTime = pu.type.dur;
    showPowerText(pu.type.label);
  }
  floatingTexts.push(new FloatingText(pu.x, pu.y, pu.type.label, pu.type.color, 24));
  updateUI();
}

function showPowerText(txt) {
  ui.powerText.textContent = txt;
  ui.powerText.style.opacity = 1;
  clearTimeout(showPowerText._t);
  showPowerText._t = setTimeout(() => { ui.powerText.style.opacity = 0; }, 1500);
}

function addShake(amt) { shake.intensity = Math.max(shake.intensity, amt); }

function loseLife() {
  lives--;
  sfxDeath();
  updateUI();
  if (lives <= 0) {
    gameOver = true;
    if (score > hiScore) {
      hiScore = score;
      try { localStorage.setItem('cosmicBubblesHi', hiScore); } catch(e) {}
      ui.hi.textContent = hiScore;
    }
    ui.overlay.innerHTML = `<h1>GAME OVER</h1><p>Score: ${score}<br>Level: ${level}<br><span class="hi">Best: ${hiScore}</span><br><br>Click to restart</p>`;
    ui.overlay.style.opacity = 1;
  }
}

function checkLevelUp() {
  const newLevel = 1 + Math.floor(score / 200);
  if (newLevel > level) {
    level = newLevel;
    sfxLevelUp();
    ui.levelUp.textContent = 'LEVEL ' + level;
    ui.levelUp.style.opacity = 1;
    setTimeout(() => { ui.levelUp.style.opacity = 0; }, 1500);
    updateUI();
  }
}

function updateUI() {
  ui.score.textContent = score;
  ui.combo.textContent = 'x' + combo;
  ui.level.textContent = level;
  ui.lives.textContent = '♥'.repeat(Math.max(0, lives));
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

canvas.addEventListener('mousedown', handleClick);
canvas.addEventListener('touchstart', handleClick, { passive: false });

function handleClick(e) {
  e.preventDefault();
  ensureAudio();
  if (gameOver) { restart(); return; }
  if (!started) { started = true; ui.overlay.style.opacity = 0; }
  const pos = getPos(e);

  for (let i = powerUps.length - 1; i >= 0; i--) {
    if (powerUps[i].contains(pos.x, pos.y)) {
      activatePower(powerUps[i]);
      powerUps.splice(i, 1);
      return;
    }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    if (bubbles[i].contains(pos.x, pos.y)) {
      if (bubbles[i].isBlackHole) {
        hitBlackHole(bubbles[i]);
      } else {
        popBubble(bubbles[i]);
      }
      bubbles.splice(i, 1);
      return;
    }
  }
}

function restart() {
  bubbles = []; particles = []; floatingTexts = []; powerUps = [];
  score = 0; combo = 1; comboTimer = 0;
  lives = 3; level = 1; frame = 0;
  spawnTimer = 0; activePower = null; activePowerTime = 0;
  gameOver = false; started = false;
  shake = { x: 0, y: 0, intensity: 0 };
  updateUI();
  ui.overlay.innerHTML = '<h1>COSMIC BUBBLES</h1><p>Лопайте пузыри, собирайте power-ups<br>Не пропускайте!</p>';
  ui.overlay.style.opacity = 1;
}

function update() {
  frame++;
  if (comboTimer > 0) comboTimer--;
  if (comboTimer === 0 && combo > 1) { combo = 1; updateUI(); }
  if (activePowerTime > 0) { activePowerTime--; if (activePowerTime <= 0) activePower = null; }

  checkLevelUp();

  spawnTimer++;
  const rate = Math.max(15, 60 - level * 5);
  if (spawnTimer >= rate) { spawnTimer = 0; spawnBubble(); }

  const magnetActive = activePower === 'magnet';
  const freezeActive = activePower === 'freeze';

  bubbles.forEach(b => {
    if (freezeActive) { b.frozen = true; b.slowTimer = 30; }
    b.update();
  });
  particles.forEach(p => p.update());
  floatingTexts.forEach(t => t.update());
  powerUps.forEach(p => p.update());

  if (shake.intensity > 0) {
    shake.x = (Math.random() - 0.5) * shake.intensity * 2;
    shake.y = (Math.random() - 0.5) * shake.intensity * 2;
    shake.intensity *= 0.88;
    if (shake.intensity < 0.5) { shake.intensity = 0; shake.x = 0; shake.y = 0; }
  }

  bubbles = bubbles.filter(b => b.alive);
  particles = particles.filter(p => p.alive);
  floatingTexts = floatingTexts.filter(t => t.alive);
  powerUps = powerUps.filter(p => p.alive);
}

function draw() {
  ctx.save();
  ctx.translate(shake.x, shake.y);
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(-10, -10, W + 20, H + 20);

  stars.forEach(s => {
    s.a += s.speed;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.sin(s.a) * 0.3})`;
    ctx.fill();
  });

  powerUps.forEach(p => p.draw());
  bubbles.forEach(b => b.draw());
  particles.forEach(p => p.draw());
  floatingTexts.forEach(t => t.draw());

  if (activePower && activePowerTime > 0) {
    const pct = activePowerTime / 300;
    ctx.fillStyle = `rgba(255,255,0,${0.15 * pct})`;
    ctx.fillRect(0, H - 4, W * (activePowerTime / 300), 4);
  }
  ctx.restore();
}

function loop() {
  if (started || !gameOver) update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
