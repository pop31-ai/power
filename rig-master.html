<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rig Master — Морской Блок</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060e1a;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Segoe UI',sans-serif;color:#dde;user-select:none}
canvas{display:block}
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:6px;font-size:11px;pointer-events:none;z-index:2}
.hc{background:rgba(0,12,28,.88);padding:3px 8px;border-radius:4px;border:1px solid #142840;white-space:nowrap}
#info{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:9px;opacity:.35;pointer-events:none;z-index:2;white-space:nowrap}
#overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none;z-index:5;transition:opacity .3s}
#overlay h1{font-size:36px;text-shadow:0 0 30px rgba(0,160,255,.5);margin-bottom:4px}
#overlay p{font-size:12px;opacity:.55;line-height:1.5}
#menu{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10;background:rgba(4,10,20,.97);padding:16px 22px;border-radius:8px;border:1px solid #1a3050;max-height:90vh;overflow-y:auto;min-width:310px;max-width:430px;display:none}
#menu h1{color:#4af;font-size:22px;margin-bottom:1px}
#menu h2{color:#578;font-size:12px;font-weight:normal;margin-bottom:8px}
#menu .cat{color:#da3;font-size:10px;margin-top:6px;text-align:left;font-weight:bold;border-bottom:1px solid #1a2a3a;padding-bottom:1px}
#menu .row{display:flex;gap:2px;flex-wrap:wrap;margin-top:2px}
#menu .b{width:28px;height:24px;background:#0c1828;border:1px solid #1a3050;color:#7bf;border-radius:2px;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;transition:.1s}
#menu .b:hover{background:#1a3050;color:#fff}
#menu .b.ok{background:#082818;border-color:#2a7a4a;color:#5f5}
#menu .b.no{opacity:.2;cursor:default;pointer-events:none}
#menu .fo{color:#445;font-size:9px;margin-top:6px}
#menu .cls{margin-top:8px;padding:5px 16px;background:#142840;border:1px solid #2a5080;color:#7bf;border-radius:4px;cursor:pointer;font-size:11px;text-align:center}
#menu .cls:hover{background:#2a5080;color:#fff}
#win{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none;z-index:8;opacity:0;transition:opacity .3s}
#win h2{font-size:26px;color:#4f4;text-shadow:0 0 16px #0a0;margin-bottom:3px}
#win p{font-size:12px;opacity:.55}
#tip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#ff8;font-size:13px;pointer-events:none;z-index:6;opacity:0;transition:opacity .4s;text-shadow:0 0 10px rgba(255,200,0,.4)}
</style>
</head>
<body>
<div id="hud">
  <div class="hc"><b id="hLv">1</b>/100</div>
  <div class="hc" id="hCat"></div>
  <div class="hc" id="hGoal"></div>
  <div class="hc">Сила <b id="hF">1</b>x/<b id="hFT">1</b>x</div>
  <div class="hc">Канат: <b id="hR">0</b></div>
</div>
<canvas id="c"></canvas>
<div id="info">ЛКМ: клик на A → через блоки → клик на B · ПКМ: удалить · Space: заново · M: меню</div>
<div id="overlay"><h1>⚓ RIG MASTER</h1><p>Канаты, блоки, лебёдки — 100 морских задач<br><span style="opacity:.4">нажмите чтобы начать</span></p></div>
<div id="win"><h2>✓ ПРОЙДЕНО</h2><p id="winP"></p></div>
<div id="tip"></div>
<div id="menu"></div>
<script>
const cv=document.getElementById('c'),X=cv.getContext('2d');
const W=cv.width=Math.min(960,innerWidth-8);
const H=cv.height=Math.min(640,innerHeight-8);

let actx;
function aud(){if(!actx)try{actx=new(AudioContext||webkitAudioContext)()}catch(e){}if(actx&&actx.state==='suspended')actx.resume()}
function snd(f,d,t,v){if(!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

let done=new Set();
try{JSON.parse(localStorage.getItem('rmD')||'[]').forEach(i=>done.add(i))}catch(e){}
function saveD(){try{localStorage.setItem('rmD',JSON.stringify([...done]))}catch(e){}}

let curLv=0,LV=null,gameOn=false,phase=0;
let ropes=[],cRope=[],dragging=false;
let force=1,tForce=1;
let complete=false,compT=0;
let particles=[],stars=[];

function initStars(){stars=[];for(let i=0;i<50;i++)stars.push({x:Math.random()*W,y:Math.random()*H*.3,r:.2+Math.random()*.7,a:Math.random()*6.28,s:.002+Math.random()*.005})}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const CATS=[
  [1,10,'Вертикальные блоки'],[11,20,'Горизонтальные'],[21,30,'Комбинированные'],
  [31,40,'Судовой ремонт'],[41,50,'Водные операции'],[51,60,'Много-блокочные'],
  [61,70,'Перенаправление'],[71,80,'Полиспасты'],[81,90,'Экспертные'],[91,100,'Мастер']
];

const GOALS=[
  'Поднять груз на палубу','Опустить в трюм','Сдвинуть влево','Сдвинуть вправо',
  'Через мачту вверх','Рычаг 2:1','Рычаг 3:1','Рычаг 4:1',
  'Двойной блок','Тройной блок','Четвёрной блок','Максимум рычага',
  'Поднять 80кг','Опустить 120кг','Сдвинуть бочку','Перекатить бревно',
  'Через бушприт','На стеньгу','Через гафель','Поднять грот',
  'Стаксель вниз','Подтянуть брас','Ванта наверх','Фалинь натянуть',
  'Починить мачту','Ремонт корпуса','Поднять трап','Исправить руль',
  'Спустить шлюпку','Поднять якорь','Через корму','На нос',
  'Два груза вверх','Два груза вниз','Два груза в стороны','Три груза',
  'Под водой','На глубине','Кренговка','Выровнять крен',
  'Подать на борт','Спустить за борт','Из трюма наверх','В трюм вниз',
  'Компрессия','Поворот 90°','Поворот 180°','Сдвинуть двойной',
  'Двойной подъём','Тройной подъём','Параллельно','Серийно',
  'Пять блоков','Шесть блоков','Семь блоков','Восемь блоков',
  'Ломаная 90°','Полу-петля','Полная петля','Змейка',
  'Макс. преимущество','Короткий путь','Баланс грузов','Симметрия',
  'Лево+вертикаль','Право+вертикаль','Обе стороны','Центр тяжести',
  'Длинный маршрут','Короткий маршрут','Кольцо','Спираль',
  'Полиспаст×2','Полиспаст×3','Полиспаст×4','Полиспаст×5',
  'Передаточное 6:1','Передаточное 8:1','Передаточное 10:1','Передаточное 12:1',
  'Мачта+бушприт','Руль+палуба','Трюм+палуба','Все вместе',
  'Вертикальная дистанция','Горизонтальная дистанция','Диагональ','Зигзаг',
  'Все блоки подряд','Все якоря','Все типы блоков','Финальное испытание'
];

const TIPS=[
  'Кликните на зелёный якорь A, протяните канат через блоки к красному B',
  'Каждый блок, который коснётся каната, увеличивает силу',
  'Чем больше блоков на пути каната — тем мощнее рычаг',
  'Правый клик удаляет канат от точки',
  'Следите за полоской силы внизу экрана'
];

function genLevel(n){
  const r=rng(n*31+7);
  const R=(a,b)=>a+r()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1));
  const d=Math.floor((n-1)/10);
  const nB=Math.min(2+d,8),nA=Math.min(2+Math.floor(d/2),6);
  tForce=Math.min(1+d,5+Math.floor(n/8));

  const anch=[];
  anch.push({x:R(60,W*.3),y:H-65+R(-15,15),tp:'start'});
  anch.push({x:R(W*.7,W-60),y:R(50,150),tp:'end'});
  for(let i=1;i<nA;i++)anch.push({x:R(50,W-50),y:R(70,H-150),tp:'mid'});

  const blk=[];
  for(let i=0;i<nB;i++){
    const v=i<Math.ceil(nB/2);
    blk.push({x:80+i*((W-160)/Math.max(1,nB-1))+R(-15,15),
      y:R(80,H-180)+Math.sin(i)*35,
      w:v?10:24,h:v?24:10,r:R(6,10),tp:v?'v':'h'});
  }

  const s=anch[0],e=anch[1];
  return{n,cat:Math.min(d,9),blk,anch,tF:tForce,
    goal:GOALS[(n-1)%GOALS.length],
    cargo:{x:s.x,y:s.y-25,wt:RI(20,200),tx:e.x,ty:e.y}};

  // Also generate ship-specific features based on category
}

function loadLevel(n){
  curLv=n;LV=genLevel(n);
  ropes=[];cRope=[];dragging=false;
  force=1;tForce=LV.tF;
  complete=false;compT=0;particles=[];gameOn=true;

  const cc=LV.cargo;
  cargo={x:cc.x,y:cc.y,vx:0,vy:0,wt:cc.wt,r:10+Math.min(cc.wt/25,5),tx:cc.tx,ty:cc.ty};

  const ci=CATS[LV.cat];
  document.getElementById('hLv').textContent=n;
  document.getElementById('hCat').textContent=ci[2];
  document.getElementById('hGoal').textContent=LV.goal;
  document.getElementById('hFT').textContent=tForce;
  document.getElementById('hF').textContent='1';
  document.getElementById('hR').textContent='0';

  document.getElementById('overlay').style.opacity='0';
  document.getElementById('win').style.opacity='0';

  if(n<=3)showTip(TIPS[n-1]);
  hideMenu();
}
let cargo=null;

function calcF(){
  let f=1;
  ropes.forEach(r=>{
    if(r.length<2)return;
    const nb=new Set();
    LV.blk.forEach((b,bi)=>{
      for(let i=0;i<r.length;i++){
        if(Math.hypot(r[i].x-b.x-b.w/2,r[i].y-b.y-b.h/2)<b.r+22)nb.add(bi);
      }
    });
    f+=nb.size;
  });
  force=Math.max(1,f);
  document.getElementById('hF').textContent=force;
  document.getElementById('hR').textContent=ropes.length;
  checkWin();
}

function checkWin(){
  if(!cargo||complete||!gameOn)return;
  const d=Math.hypot(cargo.x-cargo.tx,cargo.y-cargo.ty);
  if(d<28&&force>=Math.max(1,Math.floor(tForce*.7))){
    complete=true;compT=110;
    done.add(curLv);saveD();
    snd(523,.1,'sine',.08);setTimeout(()=>snd(659,.1,'sine',.08),70);
    setTimeout(()=>snd(784,.15,'sine',.1),140);
    document.getElementById('winP').textContent=`Сила ${force}x · Задача ${curLv}/100`;
    document.getElementById('win').style.opacity='1';
  }
}

function showTip(t){const e=document.getElementById('tip');e.textContent=t;e.style.opacity='1';setTimeout(()=>e.style.opacity='0',3500)}
function showMenu(){
  const m=document.getElementById('menu');
  let h='<h1>⚓ Rig Master</h1><h2>100 морских задач с канатами и блоками</h2>';
  CATS.forEach(([a,b,nm])=>{
    h+=`<div class="cat">${nm} (${a}-${b})</div><div class="row">`;
    for(let i=a;i<=b;i++){
      const ok=done.has(i),av=i===1||done.has(i-1);
      h+=`<div class="b ${ok?'ok':av?'':'no'}" data-l="${i}">${i}</div>`;
    }
    h+='</div>';
  });
  h+=`<div class="fo">Решено: ${done.size}/100</div>`;
  h+='<div class="cls" id="mcls">Играть</div>';
  m.innerHTML=h;m.style.display='block';
}
function hideMenu(){document.getElementById('menu').style.display='none'}

document.getElementById('menu').addEventListener('click',e=>{
  if(e.target.dataset.l)loadLevel(parseInt(e.target.dataset.l));
  if(e.target.id==='mcls')hideMenu();
});

document.addEventListener('keydown',e=>{
  if(e.key==='m'||e.key==='M'){
    const m=document.getElementById('menu');
    m.style.display==='none'||!m.style.display?showMenu():hideMenu();
  }
  if(e.key===' '&&curLv){e.preventDefault();loadLevel(curLv)}
});

function getP(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top}}

cv.addEventListener('mousedown',e=>{aud();oDown(e)});
cv.addEventListener('mousemove',e=>oMove(e));
cv.addEventListener('mouseup',e=>oUp(e));
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(cRope.length>0){cRope.pop();snd(300,.04,'sine',.04)}});
cv.addEventListener('touchstart',e=>{e.preventDefault();aud();oDown(e)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();oMove(e)},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();oUp(e)},{passive:false});
cv.addEventListener('click',()=>{if(!gameOn)loadLevel(1)});

function near(p,list,r){let b=-1,bd=r;list.forEach((a,i)=>{const d=Math.hypot(p.x-a.x,p.y-a.y);if(d<bd){bd=d;b=i}});return b}

function oDown(e){
  const p=getP(e);
  if(complete||!gameOn||!LV)return;
  const ai=near(p,LV.anch,20);
  if(ai>=0){
    if(e.button===2||e.ctrlKey){
      const a=LV.anch[ai];
      ropes=ropes.filter(r=>!r.some(pt=>Math.hypot(pt.x-a.x,pt.y-a.y)<8));
      calcF();snd(200,.06,'sine',.04);return;
    }
    cRope=[{x:LV.anch[ai].x,y:LV.anch[ai].y,ai,an:true}];
    dragging=true;snd(600,.05,'sine',.06);return;
  }
  const bc=LV.blk.map(b=>({x:b.x+b.w/2,y:b.y+b.h/2}));
  const bi=near(p,bc,26);
  if(bi>=0){
    const b=LV.blk[bi];
    cRope.push({x:b.x+b.w/2,y:b.y+b.h/2,bi,bl:true});
    dragging=true;snd(500,.05,'sine',.06);return;
  }
}

function oMove(e){
  if(!dragging||!cRope.length)return;
  const p=getP(e),l=cRope[cRope.length-1];
  if(!l.an){l.x=p.x;l.y=p.y}
  else if(Math.hypot(p.x-l.x,p.y-l.y)>12)cRope.push({x:p.x,y:p.y});
}

function oUp(){
  if(cRope.length>=2){ropes.push([...cRope]);calcF();snd(440,.08,'triangle',.05)}
  cRope=[];dragging=false;
}

function update(){
  phase+=.016;
  if(complete){compT--;if(compT<=0){if(curLv<100)loadLevel(curLv+1);else showMenu()}return}
  if(!cargo)return;

  let fx=0,fy=0;
  ropes.forEach(r=>{
    for(let i=0;i<r.length-1;i++){
      const dx=r[i+1].x-r[i].x,dy=r[i+1].y-r[i].y;
      const len=Math.hypot(dx,dy);if(len<1)return;
      const nx=dx/len,ny=dy/len;
      if(Math.hypot(cargo.x-r[i].x,cargo.y-r[i].y)<60||
         Math.hypot(cargo.x-r[i+1].x,cargo.y-r[i+1].y)<60){
        fx+=nx*Math.min(force*.3,2);fy+=ny*Math.min(force*.3,2);
      }
    }
  });

  fx+=(cargo.tx-cargo.x)*.003*force;
  fy+=(cargo.ty-cargo.y)*.003*force;
  fy+=.09;
  cargo.vx+=fx;cargo.vy+=fy;
  cargo.vx*=.89;cargo.vy*=.89;
  cargo.x+=cargo.vx;cargo.y+=cargo.vy;
  cargo.x=Math.max(cargo.r,Math.min(W-cargo.r,cargo.x));
  cargo.y=Math.max(cargo.r,Math.min(H-cargo.r,cargo.y));
  checkWin();

  if(Math.random()<.02)particles.push({x:Math.random()*W,y:H-6+Math.random()*8,vx:(Math.random()-.5)*.3,vy:-.15-Math.random()*.2,life:1,r:.4+Math.random()*1.2});
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=.01});
  particles=particles.filter(p=>p.life>0);
}

function drawWater(){
  X.save();X.beginPath();X.moveTo(0,H-22);
  for(let x=0;x<=W;x+=3)X.lineTo(x,H-22+Math.sin(x*.02+phase)*3.5+Math.sin(x*.01+phase*1.3)*2.5);
  X.lineTo(W,H);X.lineTo(0,H);X.closePath();
  const g=X.createLinearGradient(0,H-28,0,H);
  g.addColorStop(0,'rgba(0,40,80,.2)');g.addColorStop(1,'rgba(0,18,40,.65)');
  X.fillStyle=g;X.fill();X.restore();
}

function drawStars(){
  stars.forEach(s=>{s.a+=s.s;X.beginPath();X.arc(s.x,s.y,s.r,0,Math.PI*2);
    X.fillStyle=`rgba(170,190,230,${.2+Math.sin(s.a)*.12})`;X.fill()});
}

function drawShip(){
  X.save();X.translate(0,Math.sin(phase)*3);
  const sx=W*.04,sy=H-44,sw=W*.92;
  // hull
  X.beginPath();X.moveTo(sx+12,sy);
  X.quadraticCurveTo(sx-5,sy+14,sx+6,sy+32);
  X.lineTo(sx+sw-6,sy+32);
  X.quadraticCurveTo(sx+sw+5,sy+14,sx+sw-12,sy);X.closePath();
  X.fillStyle='#180c04';X.fill();X.strokeStyle='#342010';X.lineWidth=1.5;X.stroke();
  // deck planks
  X.beginPath();X.moveTo(sx+20,sy+1);X.quadraticCurveTo(sx+sw/2,sy+4,sx+sw-20,sy+1);
  X.strokeStyle='#3a2818';X.lineWidth=.8;X.stroke();
  for(let i=0;i<8;i++){const bx=sx+25+i*(sw-50)/7;
    X.beginPath();X.moveTo(bx,sy+1);X.lineTo(bx,sy+28);X.strokeStyle='#201008';X.lineWidth=.6;X.stroke()}
  // mast
  const mx=sx+sw*.35;
  X.beginPath();X.moveTo(mx,sy);X.lineTo(mx,sy-120);X.strokeStyle='#4a3020';X.lineWidth=3;X.stroke();
  // yard arms
  X.beginPath();X.moveTo(mx-40,sy-80);X.lineTo(mx+40,sy-80);X.strokeStyle='#3a2818';X.lineWidth=2;X.stroke();
  X.beginPath();X.moveTo(mx-30,sy-100);X.lineTo(mx+30,sy-100);X.strokeStyle='#3a2818';X.lineWidth=1.5;X.stroke();
  // sail hint
  X.beginPath();X.moveTo(mx-35,sy-80);X.quadraticCurveTo(mx,sy-60,mx+35,sy-80);
  X.strokeStyle='rgba(200,180,140,.25)';X.lineWidth=1;X.stroke();
  // bowsprit
  X.beginPath();X.moveTo(sx+sw-12,sy);X.lineTo(sx+sw+30,sy-35);X.strokeStyle='#3a2818';X.lineWidth=2;X.stroke();
  // rigging lines
  X.strokeStyle='rgba(100,80,60,.2)';X.lineWidth=.5;
  X.beginPath();X.moveTo(mx,sy-120);X.lineTo(sx+sw-12,sy);X.stroke();
  X.beginPath();X.moveTo(mx,sy-120);X.lineTo(sx+12,sy);X.stroke();
  X.restore();
}

function drawBlock(b){
  X.save();X.translate(b.x+b.w/2,b.y+b.h/2);
  X.beginPath();X.roundRect(-b.w/2,-b.h/2,b.w,b.h,2);
  X.fillStyle='#222230';X.fill();X.strokeStyle='#555568';X.lineWidth=1.5;X.stroke();
  X.beginPath();X.arc(0,0,b.r,0,Math.PI*2);X.strokeStyle='#6a6a7a';X.lineWidth=1.5;X.stroke();
  X.beginPath();X.arc(0,0,2,0,Math.PI*2);X.fillStyle='#999';X.fill();
  X.fillStyle='#5a7a9a';X.font='7px sans-serif';X.textAlign='center';
  X.fillText(b.tp==='v'?'В':'Г',0,b.h/2+8);
  X.restore();
}

function drawAnchor(a){
  X.save();X.translate(a.x,a.y);
  if(a.tp==='start'){
    X.beginPath();X.arc(0,0,8,0,Math.PI*2);X.fillStyle='rgba(50,200,70,.2)';X.fill();
    X.strokeStyle='#3a3';X.lineWidth=1.5;X.stroke();
    X.fillStyle='#3a3';X.font='bold 9px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText('A',0,1);
  }else if(a.tp==='end'){
    X.beginPath();X.arc(0,0,8,0,Math.PI*2);X.fillStyle='rgba(200,50,50,.2)';X.fill();
    X.strokeStyle='#a33';X.lineWidth=1.5;X.stroke();
    X.fillStyle='#a33';X.font='bold 9px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText('B',0,1);
  }else{
    X.beginPath();X.arc(0,0,5,0,Math.PI*2);X.fillStyle='rgba(200,180,50,.15)';X.fill();
    X.strokeStyle='#aa8';X.lineWidth=1;X.stroke();
  }
  X.restore();
}

function drawRope(r,col){
  if(r.length<2)return;
  X.save();X.strokeStyle=col||'#c09040';X.lineWidth=2.5;X.lineCap='round';X.lineJoin='round';
  // draw with sag
  X.beginPath();X.moveTo(r[0].x,r[0].y);
  for(let i=1;i<r.length;i++){
    const mx=(r[i-1].x+r[i].x)/2;
    const my=(r[i-1].y+r[i].y)/2+4; // sag
    X.quadraticCurveTo(r[i-1].x+(r[i].x-r[i-1].x)*.5,r[i-1].y+(r[i].y-r[i-1].y)*.5+4,r[i].x,r[i].y);
  }
  X.stroke();
  r.forEach(p=>{X.beginPath();X.arc(p.x,p.y,2,0,Math.PI*2);
    X.fillStyle=p.an?'#5d5':p.bl?'#8bf':'#c09040';X.fill()});
  X.restore();
}

function drawCargo(){
  if(!cargo)return;
  X.save();X.translate(cargo.x,cargo.y);
  X.shadowColor=complete?'#4f4':'#f80';X.shadowBlur=complete?12:5;
  X.beginPath();X.roundRect(-cargo.r,-cargo.r,cargo.r*2,cargo.r*2,3);
  X.fillStyle=complete?'#2a4a2a':'#5a3a1a';X.fill();
  X.strokeStyle=complete?'#5f5':'#b87030';X.lineWidth=1.5;X.stroke();X.shadowBlur=0;
  X.fillStyle='#ddd';X.font='bold 8px sans-serif';X.textAlign='center';X.textBaseline='middle';
  X.fillText(cargo.wt+'кг',0,0);
  X.restore();
  // target
  X.beginPath();X.arc(cargo.tx,cargo.ty,9+Math.sin(phase*3)*2,0,Math.PI*2);
  X.strokeStyle=`rgba(255,70,70,${.25+Math.sin(phase*3)*.1})`;X.lineWidth=1.5;
  X.setLineDash([3,3]);X.stroke();X.setLineDash([]);
}

function drawBar(){
  if(!cargo)return;
  const bx=8,by=H-40,bw=W-16,bh=5;
  X.fillStyle='rgba(255,255,255,.06)';X.fillRect(bx,by,bw,bh);
  const pct=Math.min(1,force/Math.max(1,tForce));
  X.fillStyle=pct>=1?'rgba(70,255,70,.45)':'rgba(70,150,255,.35)';
  X.fillRect(bx,by,bw*pct,bh);
}

function draw(){
  X.fillStyle='#070d18';X.fillRect(0,0,W,H);
  drawStars();drawWater();drawShip();
  if(LV){LV.blk.forEach(drawBlock);LV.anch.forEach(drawAnchor)}
  ropes.forEach(r=>drawRope(r));
  if(cRope.length>0)drawRope(cRope,'#ff8');
  drawCargo();drawBar();
  particles.forEach(p=>{X.beginPath();X.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    X.fillStyle=`rgba(70,170,240,${p.life*.3})`;X.fill()});
  if(complete)X.fillStyle=`rgba(0,0,0,${(110-compT)/110*.3})`,X.fillRect(0,0,W,H);
}

function loop(){if(gameOn)update();draw();requestAnimationFrame(loop)}

initStars();
showMenu();
loop();
</script>
</body>
