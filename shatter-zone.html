<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shatter Zone</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Segoe UI',sans-serif}
canvas{display:block;border-radius:8px;box-shadow:0 0 40px rgba(255,60,60,0.2)}
#ui{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:28px;color:#fff;font-size:15px;text-shadow:0 0 8px rgba(255,255,255,0.4);pointer-events:none;z-index:2}
#overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;pointer-events:none;transition:opacity 0.4s;z-index:3}
#overlay h1{font-size:42px;margin-bottom:8px;text-shadow:0 0 30px rgba(255,80,40,0.8)}
#overlay p{font-size:15px;opacity:0.7;line-height:1.7}
#overlay .hi{color:#ffcc00;font-size:18px;margin-top:6px}
#lvlTxt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0f0;font-size:34px;font-weight:bold;text-shadow:0 0 20px #0f0;pointer-events:none;opacity:0;transition:opacity 0.3s;z-index:3}
</style>
</head>
<body>
<div id="ui">
  <span>SCORE: <b id="sc">0</b></span>
  <span>LEVEL: <b id="lv">1</b></span>
  <span>SHOTS: <b id="sh">3</b></span>
  <span id="hiW">HI: <b id="hi">0</b></span>
</div>
<canvas id="c"></canvas>
<div id="overlay"><h1>SHATTER ZONE</h1><p>Кликните по пузырю — он разлетится на осколки<br>Сломайте все квадратики!</p></div>
<div id="lvlTxt"></div>
<script>
const C = document.getElementById('c');
const X = C.getContext('2d');
const W = C.width = Math.min(880, window.innerWidth - 30);
const H = C.height = Math.min(620, window.innerHeight - 30);

const ui = { sc: document.getElementById('sc'), lv: document.getElementById('lv'), sh: document.getElementById('sh'), hi: document.getElementById('hi'), overlay: document.getElementById('overlay'), lvlTxt: document.getElementById('lvlTxt') };

let audioCtx;
function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
function tone(f, d, t, v) { if (!audioCtx) return; const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = t||'sine'; o.frequency.setValueAtTime(f, audioCtx.currentTime); g.gain.setValueAtTime(v||0.12, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + d); }
function sfxPop() { tone(500+Math.random()*300, 0.1, 'sine', 0.1); }
function sfxShatter() { tone(300, 0.08, 'square', 0.08); tone(600, 0.06, 'square', 0.06); setTimeout(() => tone(900, 0.1, 'sine', 0.06), 40); }
function sfxDestroy() { tone(200, 0.15, 'sawtooth', 0.1); tone(400, 0.1, 'sine', 0.08); }
function sfxLevelUp() { [0,80,160].forEach((d,i) => setTimeout(() => tone(400+i*250, 0.2, 'square', 0.08), d)); }
function sfxBounce() { tone(800, 0.04, 'sine', 0.05); }

let blocks = [];
let bubbles = [];
let shards = [];
let particles = [];
let floats = [];
let stars = [];
let score = 0;
let level = 1;
let shots = 3;
let frame = 0;
let gameOver = false;
let started = false;
let won = false;
let hiScore = 0;
let shake = { x:0, y:0, i:0 };

try { hiScore = parseInt(localStorage.getItem('shatterHi')) || 0; } catch(e) {}
ui.hi.textContent = hiScore;

function initStars() {
  stars = [];
  for (let i = 0; i < 100; i++) stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.2+0.3, a: Math.random()*6.28, s: 0.005+Math.random()*0.01 });
}
initStars();

const BCOLS = [
  ['#ff4466','#cc2244'], ['#ff8844','#cc5522'], ['#ffcc33','#cc9911'],
  ['#44dd88','#22aa55'], ['#44aaff','#2277cc'], ['#8866ff','#5533cc'],
  ['#ff66aa','#cc3377'], ['#66ffee','#33ccbb'],
];

class Block {
  constructor(x, y, w, h, hp, col) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.hp = hp; this.maxHp = hp;
    this.col = col || BCOLS[Math.floor(Math.random()*BCOLS.length)];
    this.alive = true;
    this.vx = (Math.random()-0.5)*0.3;
    this.vy = (Math.random()-0.5)*0.3;
    this.rot = 0;
    this.rotV = (Math.random()-0.5)*0.01;
    this.shakeT = 0;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.rot += this.rotV;
    if (this.x < 0 || this.x + this.w > W) this.vx *= -1;
    if (this.y < 0 || this.y + this.h > H) this.vy *= -1;
    if (this.shakeT > 0) this.shakeT--;
  }
  hit(dmg) {
    this.hp -= dmg;
    this.shakeT = 8;
    if (this.hp <= 0) {
      this.alive = false;
      sfxDestroy();
      score += 100 * level;
      for (let i = 0; i < 16; i++) {
        particles.push(new Particle(this.x + this.w/2, this.y + this.h/2, this.col[i%2]));
      }
      floats.push(new FloatText(this.x+this.w/2, this.y+this.h/2, '+' + (100*level), this.col[0], 22));
      addShake(6);
    } else {
      sfxShatter();
      for (let i = 0; i < 6; i++) particles.push(new Particle(this.x+this.w/2, this.y+this.h/2, this.col[i%2]));
      addShake(2);
    }
    updateUI();
  }
  draw() {
    const sx = this.shakeT > 0 ? (Math.random()-0.5)*4 : 0;
    const sy = this.shakeT > 0 ? (Math.random()-0.5)*4 : 0;
    X.save();
    X.translate(this.x + this.w/2 + sx, this.y + this.h/2 + sy);
    X.rotate(this.rot);
    const hpRatio = this.hp / this.maxHp;
    const r = 6;
    X.beginPath();
    X.roundRect(-this.w/2, -this.h/2, this.w, this.h, r);
    X.fillStyle = this.col[0] + Math.floor(hpRatio * 255).toString(16).padStart(2,'0');
    X.fill();
    X.strokeStyle = this.col[1];
    X.lineWidth = 2;
    X.stroke();
    X.shadowColor = this.col[0];
    X.shadowBlur = 8 * hpRatio;
    X.stroke();
    X.shadowBlur = 0;
    if (this.hp < this.maxHp) {
      X.fillStyle = '#fff';
      X.font = 'bold 14px sans-serif';
      X.textAlign = 'center';
      X.textBaseline = 'middle';
      X.fillText(this.hp, 0, 0);
    }
    X.restore();
  }
  containsRect(px, py) {
    return px >= this.x && px <= this.x+this.w && py >= this.y && py <= this.y+this.h;
  }
}

class Bubble {
  constructor() {
    this.r = 20 + Math.random()*15;
    this.x = this.r + Math.random()*(W - this.r*2);
    this.y = this.r + Math.random()*(H - this.r*2);
    this.vx = (Math.random()-0.5)*0.6;
    this.vy = (Math.random()-0.5)*0.6;
    this.col = BCOLS[Math.floor(Math.random()*BCOLS.length)];
    this.alive = true;
    this.pulse = Math.random()*6.28;
    this.glow = 10 + Math.random()*10;
  }
  update() {
    this.pulse += 0.04;
    this.x += this.vx; this.y += this.vy;
    if (this.x - this.r < 0 || this.x + this.r > W) this.vx *= -1;
    if (this.y - this.r < 0 || this.y + this.r > H) this.vy *= -1;
    this.x = Math.max(this.r, Math.min(W-this.r, this.x));
    this.y = Math.max(this.r, Math.min(H-this.r, this.y));
  }
  draw() {
    const w = Math.sin(this.pulse)*2;
    const r = this.r + w;
    const g = X.createRadialGradient(this.x-r*0.3, this.y-r*0.3, r*0.1, this.x, this.y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.5)');
    g.addColorStop(0.4, this.col[0]);
    g.addColorStop(1, this.col[1]);
    X.save();
    X.shadowColor = this.col[0];
    X.shadowBlur = this.glow;
    X.beginPath();
    X.arc(this.x, this.y, r, 0, Math.PI*2);
    X.fillStyle = g;
    X.fill();
    X.shadowBlur = 0;
    X.beginPath();
    X.arc(this.x-r*0.25, this.y-r*0.25, r*0.25, 0, Math.PI*2);
    X.fillStyle = 'rgba(255,255,255,0.2)';
    X.fill();
    X.restore();
  }
  contains(px, py) {
    const dx = px-this.x, dy = py-this.y;
    return dx*dx+dy*dy < this.r*this.r*1.2;
  }
}

class Shard {
  constructor(x, y, col) {
    this.x = x; this.y = y;
    const a = Math.random()*Math.PI*2;
    const spd = 4 + Math.random()*8;
    this.vx = Math.cos(a)*spd;
    this.vy = Math.sin(a)*spd;
    this.r = 3 + Math.random()*4;
    this.col = col;
    this.life = 1;
    this.decay = 0.008 + Math.random()*0.008;
    this.alive = true;
    this.trail = [];
  }
  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 6) this.trail.shift();
    this.x += this.vx; this.y += this.vy;
    this.vx *= 0.985; this.vy *= 0.985;
    this.vy += 0.04;
    this.life -= this.decay;
    if (this.life <= 0 || this.x < -20 || this.x > W+20 || this.y < -20 || this.y > H+20) this.alive = false;

    blocks.forEach(b => {
      if (b.alive && this.life > 0.3 && b.containsRect(this.x, this.y)) {
        b.hit(1);
        this.life -= 0.4;
        this.vx *= -0.3;
        this.vy *= -0.3;
      }
    });
  }
  draw() {
    for (let i = 0; i < this.trail.length; i++) {
      const t = this.trail[i];
      const a = (i / this.trail.length) * this.life * 0.5;
      X.beginPath();
      X.arc(t.x, t.y, this.r * (i/this.trail.length) * 0.6, 0, Math.PI*2);
      X.fillStyle = this.col;
      X.globalAlpha = a;
      X.fill();
    }
    X.globalAlpha = 1;
    X.save();
    X.shadowColor = this.col;
    X.shadowBlur = 12;
    X.beginPath();
    X.arc(this.x, this.y, this.r * this.life, 0, Math.PI*2);
    X.fillStyle = this.col;
    X.fill();
    X.restore();
  }
}

class Particle {
  constructor(x, y, col) {
    this.x = x; this.y = y;
    this.vx = (Math.random()-0.5)*6;
    this.vy = (Math.random()-0.5)*6;
    this.r = 1.5 + Math.random()*3;
    this.col = col;
    this.life = 1;
    this.decay = 0.02 + Math.random()*0.03;
    this.alive = true;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.04; this.vx *= 0.97;
    this.life -= this.decay;
    if (this.life <= 0) this.alive = false;
  }
  draw() {
    X.save();
    X.globalAlpha = this.life;
    X.beginPath();
    X.arc(this.x, this.y, this.r*this.life, 0, Math.PI*2);
    X.fillStyle = this.col;
    X.fill();
    X.restore();
  }
}

class FloatText {
  constructor(x, y, text, col, sz) {
    this.x = x; this.y = y;
    this.text = text; this.col = col;
    this.sz = sz || 16;
    this.life = 1; this.vy = -1.5;
    this.alive = true;
  }
  update() {
    this.y += this.vy; this.vy *= 0.97;
    this.life -= 0.015;
    if (this.life <= 0) this.alive = false;
  }
  draw() {
    X.save();
    X.globalAlpha = this.life;
    X.font = `bold ${this.sz}px sans-serif`;
    X.textAlign = 'center';
    X.shadowColor = this.col;
    X.shadowBlur = 8;
    X.fillStyle = this.col;
    X.fillText(this.text, this.x, this.y);
    X.restore();
  }
}

function addShake(a) { shake.i = Math.max(shake.i, a); }

function genLevel(lvl) {
  blocks = [];
  bubbles = [];
  shards = [];
  particles = [];
  floats = [];
  shots = 2 + lvl;
  if (lvl > 3) shots = Math.max(2, shots - 1);

  const cols = Math.min(6, 2 + Math.floor(lvl / 2));
  const rows = Math.min(5, 1 + Math.floor(lvl / 2));
  const bw = 50 + Math.min(20, lvl * 3);
  const bh = 35 + Math.min(15, lvl * 2);
  const gap = 12;
  const ox = (W - cols * (bw + gap)) / 2;
  const oy = 50;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const hp = Math.min(1 + Math.floor(lvl / 3), 5) + (Math.random() < 0.2 ? 1 : 0);
      blocks.push(new Block(ox + c * (bw + gap), oy + r * (bh + gap), bw, bh, hp));
    }
  }

  const numBub = Math.min(6, 2 + Math.floor(lvl / 2));
  for (let i = 0; i < numBub; i++) {
    bubbles.push(new Bubble());
  }
  updateUI();
}

function popBubble(b) {
  sfxPop();
  for (let i = 0; i < 18 + level * 2; i++) {
    shards.push(new Shard(b.x, b.y, b.col[i % 2]));
  }
  for (let i = 0; i < 10; i++) {
    particles.push(new Particle(b.x, b.y, b.col[i % 2]));
  }
  addShake(5);
  b.alive = false;
  shots--;
  updateUI();
  checkWin();
}

function checkWin() {
  if (won || gameOver) return;
  const alive = blocks.filter(b => b.alive).length;
  if (alive === 0) {
    won = true;
    sfxLevelUp();
    ui.lvlTxt.textContent = 'LEVEL CLEAR!';
    ui.lvlTxt.style.opacity = 1;
    setTimeout(() => { ui.lvlTxt.style.opacity = 0; }, 1500);
    setTimeout(() => { level++; won = false; genLevel(level); }, 1800);
  } else if (shots <= 0 && bubbles.filter(b => b.alive).length === 0) {
    gameOver = true;
    if (score > hiScore) {
      hiScore = score;
      try { localStorage.setItem('shatterHi', hiScore); } catch(e) {}
      ui.hi.textContent = hiScore;
    }
    ui.overlay.innerHTML = `<h1>GAME OVER</h1><p>Score: ${score}<br>Level: ${level}<br><span class="hi">Best: ${hiScore}</span><br><br>Click to restart</p>`;
    ui.overlay.style.opacity = 1;
  }
}

function updateUI() {
  ui.sc.textContent = score;
  ui.lv.textContent = level;
  ui.sh.textContent = shots;
}

function getPos(e) {
  const rect = C.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - rect.left, y: t.clientY - rect.top };
}

C.addEventListener('mousedown', handleClick);
C.addEventListener('touchstart', handleClick, { passive: false });

function handleClick(e) {
  e.preventDefault();
  ensureAudio();
  if (gameOver) { restart(); return; }
  if (!started) { started = true; ui.overlay.style.opacity = 0; }
  if (shots <= 0) return;
  const pos = getPos(e);
  for (let i = bubbles.length - 1; i >= 0; i--) {
    if (bubbles[i].contains(pos.x, pos.y)) {
      popBubble(bubbles[i]);
      return;
    }
  }
}

function restart() {
  score = 0; level = 1; gameOver = false; started = false; won = false;
  shake = { x:0, y:0, i:0 };
  ui.overlay.innerHTML = '<h1>SHATTER ZONE</h1><p>Кликните по пузырю — он разлетится на осколки<br>Сломайте все квадратики!</p>';
  ui.overlay.style.opacity = 1;
  genLevel(1);
}

function update() {
  frame++;
  if (shake.i > 0) {
    shake.x = (Math.random()-0.5)*shake.i*2;
    shake.y = (Math.random()-0.5)*shake.i*2;
    shake.i *= 0.85;
    if (shake.i < 0.3) { shake.i = 0; shake.x = 0; shake.y = 0; }
  }
  blocks.forEach(b => b.update());
  bubbles.forEach(b => b.update());
  shards.forEach(s => s.update());
  particles.forEach(p => p.update());
  floats.forEach(f => f.update());
  blocks = blocks.filter(b => b.alive);
  bubbles = bubbles.filter(b => b.alive);
  shards = shards.filter(s => s.alive);
  particles = particles.filter(p => p.alive);
  floats = floats.filter(f => f.alive);
  if (!gameOver && started) checkWin();
}

function draw() {
  X.save();
  X.translate(shake.x, shake.y);
  X.fillStyle = '#080812';
  X.fillRect(-10, -10, W+20, H+20);

  stars.forEach(s => {
    s.a += s.s;
    X.beginPath();
    X.arc(s.x, s.y, s.r, 0, Math.PI*2);
    X.fillStyle = `rgba(255,255,255,${0.25+Math.sin(s.a)*0.25})`;
    X.fill();
  });

  blocks.forEach(b => b.draw());
  bubbles.forEach(b => b.draw());
  shards.forEach(s => s.draw());
  particles.forEach(p => p.draw());
  floats.forEach(f => f.draw());

  X.restore();
}

genLevel(1);
function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
